# Временная ветка: проверка дублей озвучки v5 (распознавание GigaAM + ударения). Результат — в ветку promo-vo5, потом ветки удаляются.
name: Promo voice v5 check
on:
  push:
    branches: [promo-vo5s-src]
permissions:
  contents: write
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: { shard: [0, 1, 2, 3, 4, 5] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: |
          git clone -q --depth 1 -b promo-vo5 "https://github.com/${{ github.repository }}" vo
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers==4.57.1 librosa soundfile sherpa-onnx
          mkdir -p asr && cd asr
          curl -fsSL https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-nemo-transducer-giga-am-v2-russian-2025-04-19.tar.bz2 | tar xj
      - run: python score.py
        env: { SHARD: "${{ matrix.shard }}", NSHARDS: '6' }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "sc-${{ matrix.shard }}", path: scores/ }
  collect:
    needs: [score]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: parts }
      - run: |
          git clone -q --depth 1 -b promo-vo5 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" pub
          mkdir -p pub/scores2 && find parts -name '*.json' -exec cp {} pub/scores2/ \;
          cd pub && git config user.name "kadro-bot" && git config user.email "kadro-bot@users.noreply.github.com"
          git add -A && git commit -qm "Проверка озвучки v5 (временно)" && git push -q origin promo-vo5
