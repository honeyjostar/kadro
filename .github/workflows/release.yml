# Сборка установщика для Windows на серверах GitHub.
# Когда запускается:
#   • поменяли "version" в package.json и отправили в master — если релиза с этой версией ещё нет,
#     он создаётся сам (тег vX.Y.Z), к нему прикладываются установщик и zip;
#     если релиз уже есть — у него только обновляется описание из docs/RELEASE_NOTES.md;
#   • опубликовали релиз в интерфейсе GitHub или отправили тег vX.Y.Z — файлы прикладываются к нему;
#   • вручную: Actions → Release → Run workflow (файлы — в артефактах сборки).
# Подпись кода (SignPath, см. docs/SIGNING-SETUP.md): включается сама, когда в настройках репозитория есть
# секрет SIGNPATH_API_TOKEN и переменная SIGNPATH_ORGANIZATION_ID. Подписываются Kadro.exe (до упаковки в установщик)
# и сам установщик; на каждый выпуск SignPath присылает две заявки на подтверждение. Не подписалось
# (не подтвердили вовремя, отклонили, сбой) — выпуск выходит без подписи, как раньше, с предупреждением в сборке.
name: Release

on:
  push:
    branches: [master]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      sign:
        description: 'Подписать через SignPath (если настроено) — придут заявки на подтверждение'
        type: boolean
        default: false

permissions:
  contents: write
  # SignPath скачивает файлы на подпись из артефактов сборки
  actions: read

env:
  # CUDA-версия ONNX Runtime не нужна (программа работает на процессоре и DirectML) — не качаем лишние сотни мегабайт
  ONNXRUNTIME_NODE_INSTALL: skip

# релиз из интерфейса создаёт и тег — одинаковые сборки идут по очереди, а не одновременно
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-installer:
    runs-on: ubuntu-24.04
    # с подписью сборка ждёт, пока заявки подтвердят (до двух часов каждую)
    timeout-minutes: ${{ vars.SIGNPATH_ORGANIZATION_ID && 330 || 60 }}
    steps:
      - uses: actions/checkout@v4

      - name: Версия и нужна ли сборка
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          SKIP=false
          # обычный коммит в master собираем, только если релиза с этой версией ещё нет
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "branch" ]; then
            if gh release view "v$V" --repo "${{ github.repository }}" >/dev/null 2>&1; then SKIP=true; fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "Версия $V, пропустить сборку: $SKIP"

      # релиз этой версии уже есть — только обновляем его описание из docs/RELEASE_NOTES.md (секунды, без сборки)
      - name: Описание релиза
        if: steps.ver.outputs.skip == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v${{ steps.ver.outputs.version }}" --repo "${{ github.repository }}" --notes-file docs/RELEASE_NOTES.md

      - uses: actions/setup-node@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Инструменты (NSIS, zip, FFmpeg для тестов)
        if: steps.ver.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis unzip zip ffmpeg mono-mcs libmono-system-windows-forms4.0-cil binutils-mingw-w64-x86-64

      - name: Зависимости
        if: steps.ver.outputs.skip != 'true'
        run: npm ci

      - name: Проверка типов и тесты
        if: steps.ver.outputs.skip != 'true'
        run: |
          npm run typecheck
          npm run test:ci

      - name: Сборка кода
        if: steps.ver.outputs.skip != 'true'
        run: npm run build

      - name: Electron и FFmpeg для Windows
        if: steps.ver.outputs.skip != 'true'
        run: |
          EV=$(node -p "require('electron/package.json').version")
          curl -fsSL -o electron-win.zip "https://github.com/electron/electron/releases/download/v${EV}/electron-v${EV}-win32-x64.zip"
          curl -fsSL -o ffmpeg-win.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-shared-8.1.zip"

      - name: Папка программы
        if: steps.ver.outputs.skip != 'true'
        run: node scripts/pack-win.mjs --electron electron-win.zip --ffmpeg ffmpeg-win.zip --app-only

      - name: Подписывать ли
        id: sign
        if: steps.ver.outputs.skip != 'true'
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          ORG: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          ON=false
          if [ -n "$TOKEN" ] && [ -n "$ORG" ]; then
            if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.sign }}" = "true" ]; then ON=true; fi
          fi
          echo "on=$ON" >> "$GITHUB_OUTPUT"
          echo "Подпись: $ON"
          if [ "$ON" = true ]; then sudo apt-get install -y osslsigncode; fi

      - name: Kadro.exe на подпись
        id: up-app
        if: steps.sign.outputs.on == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-kadro-exe
          path: release/win-unpacked/Kadro.exe
          retention-days: 1

      - name: Подпись Kadro.exe (SignPath)
        id: sign-app
        if: steps.sign.outputs.on == 'true'
        continue-on-error: true
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Kadro' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'release-signing' }}
          github-artifact-id: ${{ steps.up-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: release/signed-app

      - name: Подписанный Kadro.exe — в папку программы
        id: app-signed
        if: steps.sign.outputs.on == 'true'
        run: bash scripts/use-signed.sh release/signed-app/Kadro.exe release/win-unpacked/Kadro.exe

      - name: Установщик и переносная версия
        if: steps.ver.outputs.skip != 'true'
        run: node scripts/pack-win.mjs --from-app --portable

      # маленький веб-установщик (~600 КБ, тёмный, с маскотом): язык, «О тебе», скачивает последний Kadro-Setup и ставит его
      - name: Веб-установщик
        if: steps.ver.outputs.skip != 'true'
        run: node scripts/pack-web-setup.mjs

      - name: Установщик на подпись
        id: up-setup
        if: steps.sign.outputs.on == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-kadro-setup
          path: release/Kadro-Setup-*.exe
          retention-days: 1

      - name: Подпись установщика (SignPath)
        id: sign-setup
        if: steps.sign.outputs.on == 'true'
        continue-on-error: true
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Kadro' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'release-signing' }}
          github-artifact-id: ${{ steps.up-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: release/signed-setup

      - name: Подписанный установщик — на место
        if: steps.sign.outputs.on == 'true'
        run: |
          V=${{ steps.ver.outputs.version }}
          bash scripts/use-signed.sh release/signed-setup/Kadro-Setup-$V.exe release/Kadro-Setup-$V.exe
          rm -rf release/signed-app release/signed-setup

      # контрольные суммы: Kadro сверяет по ним скачанное обновление
      - name: SHA256SUMS.txt
        if: steps.ver.outputs.skip != 'true'
        run: |
          cd release
          sha256sum Kadro-Setup-*.exe Kadro-*-portable.zip Kadro-Web-Setup.exe > SHA256SUMS.txt
          # сколько Kadro займёт после установки — веб-установщик показывает по этому числу ход распаковки
          if [ -d win-unpacked ]; then echo "# installed-bytes $(du -sb win-unpacked | cut -f1)" >> SHA256SUMS.txt; fi
          cat SHA256SUMS.txt

      - name: Файлы в артефакты сборки
        if: steps.ver.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Kadro-Windows
          path: |
            release/Kadro-Setup-*.exe
            release/Kadro-*-portable.zip
            release/Kadro-Web-Setup.exe
            release/SHA256SUMS.txt
          retention-days: 14

      - name: Релиз на GitHub
        if: steps.ver.outputs.skip != 'true' && github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: Kadro ${{ steps.ver.outputs.version }}
          body_path: docs/RELEASE_NOTES.md
          files: |
            release/Kadro-Setup-*.exe
            release/Kadro-*-portable.zip
            release/Kadro-Web-Setup.exe
            release/SHA256SUMS.txt
