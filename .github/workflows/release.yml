# Сборка установщика для Windows на серверах GitHub.
# Запуск: отправить тег версии (git tag v0.3.0 && git push origin v0.3.0) — установщик появится в Releases.
# Можно и вручную: Actions → Release → Run workflow (тогда установщик будет в артефактах сборки).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # CUDA-версия ONNX Runtime не нужна (программа работает на процессоре и DirectML) — не качаем лишние сотни мегабайт
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  windows-installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Инструменты (NSIS, FFmpeg для тестов)
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis unzip ffmpeg

      - name: Зависимости
        run: npm ci

      - name: Проверка типов и тесты
        run: |
          npm run typecheck
          npm run test:ci

      - name: Сборка кода
        run: npm run build

      - name: Electron и FFmpeg для Windows
        run: |
          EV=$(node -p "require('electron/package.json').version")
          curl -fsSL -o electron-win.zip "https://github.com/electron/electron/releases/download/v${EV}/electron-v${EV}-win32-x64.zip"
          curl -fsSL -o ffmpeg-win.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip"

      - name: Установщик
        run: node scripts/pack-win.mjs --electron electron-win.zip --ffmpeg ffmpeg-win.zip

      - name: Файл установщика в артефакты сборки
        uses: actions/upload-artifact@v4
        with:
          name: Kadro-Setup
          path: release/Kadro-Setup-*.exe
          retention-days: 14

      - name: Релиз на GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/Kadro-Setup-*.exe
          body_path: docs/RELEASE_NOTES.md
